name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # Astro toma las PUBLIC_ del archivo .env, no del entorno del runner,
      # asi que hay que escribirlo antes de compilar.
      - name: Armar .env con los secrets
        run: |
          {
            echo "PUBLIC_EMAILJS_SERVICE=${{ secrets.EMAILJS_SERVICE }}"
            echo "PUBLIC_EMAILJS_TEMPLATE=${{ secrets.EMAILJS_TEMPLATE }}"
            echo "PUBLIC_EMAILJS_KEY=${{ secrets.EMAILJS_KEY }}"
            echo "PUBLIC_CLOUDINARY_CLOUD=${{ secrets.CLOUDINARY_CLOUD }}"
            echo "PUBLIC_CLOUDINARY_PRESET=${{ secrets.CLOUDINARY_PRESET }}"
          } > .env
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
