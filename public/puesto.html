<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Expediente reservado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: light; --fondo: #DCCFAF; --hoja: #F6EFDC; --hoja-2: #EDE3C9; --linea: #C9B893; --tinta: #241D14; --tinta-suave: #61563F; --sello: #A5231D; --azul: #2B4A7A; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --fondo: #16110B; } }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 1.2rem;
    display: grid; place-items: center;
    background: var(--fondo); color: var(--tinta);
    font-family: "Courier Prime", "Courier New", monospace; font-size: 16px; line-height: 1.6;
  }
  form {
    background: var(--hoja); border: 1px solid var(--linea);
    box-shadow: 0 10px 26px rgba(30, 24, 15, 0.28);
    padding: clamp(1.2rem, 4vw, 2rem); width: min(380px, 100%);
    display: grid; gap: 0.8rem;
  }
  .sello { font-family: "Special Elite", monospace; font-size: 0.72rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--sello); margin: 0; }
  h1 { font-family: "Special Elite", monospace; font-weight: 400; font-size: 1.5rem; text-transform: uppercase; letter-spacing: 0.04em; margin: 0; }
  label { font-family: "Special Elite", monospace; font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--tinta-suave); }
  input {
    font-family: "Courier Prime", monospace; font-size: 1.2rem; letter-spacing: 0.35em; text-align: center;
    color: var(--tinta); background: var(--hoja-2);
    border: 1px solid var(--linea); border-bottom: 2px solid var(--sello);
    padding: 0.5rem 0.6rem; width: 100%;
  }
  input:focus-visible, button:focus-visible { outline: 3px solid var(--azul); outline-offset: 2px; }
  button {
    font-family: "Special Elite", monospace; font-size: 0.78rem; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--hoja); background: var(--sello); border: 2px solid var(--sello); border-radius: 3px;
    padding: 0.45rem 0.9rem; cursor: pointer;
  }
  button[disabled] { opacity: 0.6; cursor: progress; }
  .error { color: var(--sello); font-size: 0.85rem; min-height: 1.25em; margin: 0; }
  .pie { font-size: 0.8rem; color: var(--tinta-suave); margin: 0; }
  .mal { animation: sacudir 0.36s; }
  @keyframes sacudir { 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }
</style>
</head>
<body>
<form id="ficha">
  <p class="sello">Acceso restringido</p>
  <h1>Expediente reservado</h1>
  <label for="clave">Clave de apertura</label>
  <input id="clave" type="password" inputmode="numeric" autocomplete="off" autocapitalize="off" spellcheck="false" required>
  <p class="error" id="error" role="alert"></p>
  <button type="submit" id="abrir">Abrir</button>
  <p class="pie" id="pie">El plano viaja cifrado: sin la clave no hay nada que leer.</p>
</form>

    function bytes(b64) {
      var bin = atob(b64);
      var a = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
      return a;
    }
    function texto(a) {
      var s = "";
      for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]);
      return btoa(s);
    }
    function hoy() {
      var d = new Date();
      return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
    }

    // sin crypto.subtle no hay forma de abrir la caja: pasa al abrir el archivo
    // con doble clic (file://), donde el navegador no lo habilita
    if (!(window.crypto && crypto.subtle)) {
      error.textContent = "Este navegador no puede descifrar el plano desde un archivo suelto.";
      document.getElementById("pie").textContent = "Abrilo servido: npx serve sitio -l 4321 y entrá por http://localhost:4321/noche-lapices/puesto.html";
      campo.disabled = boton.disabled = true;
      return;
    }

    function desdeClave(clave) {
      return crypto.subtle.importKey("raw", new TextEncoder().encode(clave), "PBKDF2", false, ["deriveKey"])
        .then(function (base) {
          return crypto.subtle.deriveKey(
            { name: "PBKDF2", salt: bytes(cofre.sal), iterations: cofre.vueltas, hash: "SHA-256" },
            base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]
          );
        });
    }

    function abrirCon(llave) {
      return crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(cofre.vi) }, llave, bytes(cofre.caja))
        .then(function (plano) {
          var html = new TextDecoder().decode(plano);
          return crypto.subtle.exportKey("raw", llave).then(function (cruda) {
            // la llave queda guardada por hoy, para no pedirla en cada visita
            var valor = hoy() + "|" + texto(new Uint8Array(cruda));
            var recuerda = false;
            try {
              localStorage.setItem(LLAVE, valor);
              recuerda = localStorage.getItem(LLAVE) === valor;
            } catch (e) {}
            if (!recuerda) {
              try { sessionStorage.setItem(LLAVE, valor); recuerda = sessionStorage.getItem(LLAVE) === valor; } catch (e) {}
            }
            // si no hay dónde guardarla, mejor avisar que volver a pedirla en silencio
            var nota = recuerda ? "" : '<p style="position:fixed;left:0;right:0;bottom:0;z-index:99;margin:0;padding:.5rem .9rem;' +
              'background:#A5231D;color:#F6EFDC;font:12px monospace;text-align:center">' +
              'Este navegador no puede recordar la clave (ventana privada o datos del sitio bloqueados): la va a pedir cada vez.</p>';
            document.open();
            document.write(html + nota);
            document.close();
          });
        });
    }

    // si esta máquina ya abrió el plano hoy, entra sin preguntar
    function llaveGuardada() {
      var valor = "";
      try { valor = localStorage.getItem(LLAVE) || ""; } catch (e) {}
      if (!valor) { try { valor = sessionStorage.getItem(LLAVE) || ""; } catch (e) {} }
      var partes = valor.split("|");
      return partes[0] === hoy() && partes[1] ? partes[1] : null;
    }

    var guardada = llaveGuardada();
    if (guardada) {
      boton.disabled = true;
      boton.textContent = "Abriendo…";
      crypto.subtle.importKey("raw", bytes(guardada), "AES-GCM", true, ["decrypt"])
        .then(abrirCon)
        .catch(function () {
          // la llave de hoy no sirvió: se avisa en vez de pedirla sin explicar
          try { localStorage.removeItem(LLAVE); } catch (e) {}
          try { sessionStorage.removeItem(LLAVE); } catch (e) {}
          boton.disabled = false;
          boton.textContent = "Abrir";
          error.textContent = "La llave guardada no sirvió: poné la clave otra vez.";
          campo.focus();
        });
    } else {
      campo.focus();
    }

    ficha.addEventListener("submit", function (e) {
      e.preventDefault();
      error.textContent = "";
      boton.disabled = true;
      boton.textContent = "Abriendo…";
      desdeClave(campo.value.trim())
        .then(abrirCon)
        .catch(function () {
          boton.disabled = false;
          boton.textContent = "Abrir";
          error.textContent = "Clave incorrecta.";
          campo.value = "";
          campo.focus();
          campo.classList.add("mal");
          setTimeout(function () { campo.classList.remove("mal"); }, 380);
        });
    });
  })();
</script>
</body>
</html>
